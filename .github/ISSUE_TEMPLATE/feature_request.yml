name: Feature request
description: Suggest a new clock face, calendar style or feature
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and why? Sketches or screenshots are welcome.
    validations:
      required: true
  - type: checkboxes
    id: offline
    attributes:
      label: Offline check
      options:
        - label: This works without internet access (OpenStandby is offline-only)
          required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself
