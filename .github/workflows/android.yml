name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest

      - name: Verify the app stays offline
        run: |
          manifest=$(find app/build/intermediates/merged_manifest -name AndroidManifest.xml | head -n 1)
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "INTERNET permission found in merged manifest. OpenStandby must stay offline."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports
